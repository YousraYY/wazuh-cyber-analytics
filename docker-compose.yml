services:

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.3
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml

  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.3
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=http://wazuh.indexer:9200
    depends_on:
      - wazuh.indexer
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.3
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "8443:5601"
    volumes:
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_SSL_ENABLED=false
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - WAZUH_API_URL=http://wazuh.manager
    depends_on:
      - wazuh.indexer
      - wazuh.manager


volumes:
  wazuh-indexer-data:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
